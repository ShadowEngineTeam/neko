name: CI
on: [workflow_dispatch]

env:
  NEKO_VERSION: 2.4.1

jobs:
  linux-build:
    name: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        link_type: [static, dynamic]
        include:
          - link_type: static
            name_suffix: -static
            STATIC_DEPS: all
          - link_type: dynamic
            STATIC_DEPS: none
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qqy
          sudo apt-get install -qqy ninja-build libgtk-3-dev

      - name: Install dynamic dependencies
        if: ${{ matrix.link_type == 'dynamic' }}
        run: |
         sudo apt-get install -qqy libgc-dev libpcre2-dev zlib1g-dev apache2-dev libmysqlclient-dev libsqlite3-dev libmbedtls-dev

      - name: CMake
        run: cmake . -DSTATIC_DEPS=${{ matrix.STATIC_DEPS }} -G Ninja -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE

      - name: Download dependencies
        run: ninja download_deps || ninja download_deps || ninja download_deps
        if: ${{ matrix.link_type == 'static' }}

      - name: Build
        run: ninja

      - name: Check runtime dependencies
        run: |
          set -ex
          ldd ./bin/neko
          ldd ./bin/nekoc
          ldd ./bin/nekoml
          ldd ./bin/nekotools

      - name: Test
        run: ctest --verbose

      - name: Package
        run: ninja package

      - name: Check version
        shell: bash
        run: |
          set -ex
          [ "`./bin/neko -version`" == "$NEKO_VERSION" ]

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux${{ matrix.name_suffix }}-${{ matrix.arch }}-binaries
          path: bin/neko-${{ env.NEKO_VERSION }}-linux*.tar.gz

  linux-armv7-build:
    name: linux (armv7)
    strategy:
      fail-fast: false
      matrix:
        link_type: [static, dynamic]
        include:
          - link_type: static
            name_suffix: -static
            STATIC_DEPS: all
          - link_type: dynamic
            STATIC_DEPS: none
    runs-on: ubuntu-22.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up armhf build root
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy qemu-user-static binfmt-support debootstrap
          sudo debootstrap --arch=armhf --variant=buildd \
            bookworm rootfs http://deb.debian.org/debian
          sudo mount -t proc none rootfs/proc
          sudo mount -t sysfs none rootfs/sys
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /dev/pts rootfs/dev/pts
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get update -qqy
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -qqy \
            build-essential autoconf automake libtool cmake ninja-build pkg-config git ca-certificates curl libgtk-3-dev

      - name: Install dynamic dependencies
        if: ${{ matrix.link_type == 'dynamic' }}
        run: |
          set -ex
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -qqy \
            libgc-dev libpcre2-dev zlib1g-dev libmariadb-dev libsqlite3-dev libmbedtls-dev

      - name: Build
        run: |
          set -ex
          sudo mkdir -p rootfs/neko
          sudo mount --bind "$PWD" rootfs/neko
          sudo chroot rootfs linux32 env NEKO_VERSION="$NEKO_VERSION" bash -ex -c '
            cd /neko
            git config --global --add safe.directory /neko
            export CFLAGS="-mfpu=vfpv3-d16"
            export CXXFLAGS="-mfpu=vfpv3-d16"
            cmake . -DSTATIC_DEPS=${{ matrix.STATIC_DEPS }} -DWITH_APACHE=OFF -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
            if [ "${{ matrix.link_type }}" = "static" ]; then
              ninja download_deps || ninja download_deps || ninja download_deps
            fi
            ninja
            ldd ./bin/neko
            ldd ./bin/nekoc
            ldd ./bin/nekoml
            ldd ./bin/nekotools
            ctest --verbose
            ninja package
            [ "$(./bin/neko -version)" = "$NEKO_VERSION" ]
          '

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux${{ matrix.name_suffix }}-armv7-binaries
          path: bin/neko-${{ env.NEKO_VERSION }}-linux-armv7.tar.gz

  mac-build:
    name: mac
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        link_type: [static, dynamic]
        include:
          - arch: arm64
            os: macos-26
          - arch: amd64
            os: macos-15-intel
          - link_type: static
            BREWFILE: extra/Brewfile-STATIC_DEPS_ALL
            STATIC_DEPS: all
            name_suffix: -static
          - link_type: dynamic
            BREWFILE: extra/Brewfile-STATIC_DEPS_NONE
            STATIC_DEPS: none

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_TYPE: RelWithDebInfo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          set -ex
          brew update
          brew bundle --file="${{ matrix.BREWFILE }}"

      - name: CMake
        run: cmake . -DSTATIC_DEPS=${{ matrix.STATIC_DEPS }} -G Ninja -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE

      - name: Download dependencies
        run: ninja download_deps || ninja download_deps || ninja download_deps
        if: ${{ matrix.link_type == 'static' }}

      - name: Build
        run: ninja

      - name: Check runtime dependencies
        run: |
          set -ex
          otool -L ./bin/neko
          otool -L ./bin/nekoc
          otool -L ./bin/nekoml
          otool -L ./bin/nekotools

      - name: Test
        run: ctest --verbose

      - name: Package
        run: ninja package

      - name: Check version
        shell: bash
        run: |
          set -ex
          [ "`./bin/neko -version`" == "$NEKO_VERSION" ]

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mac${{ matrix.name_suffix }}-${{ matrix.arch }}-binaries
          path: bin/neko-${{ env.NEKO_VERSION }}-osx*.tar.gz

  windows-build:
    name: windows
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
        include:
          - arch: x86
            cmake_arch: Win32
            runner: windows-2022
          - arch: x64
            cmake_arch: x64
            name_suffix: 64
            runner: windows-2022
          - arch: arm64
            cmake_arch: ARM64
            name_suffix: -arm64
            runner: windows-11-arm
            # Apache httpd's old CMakeLists can't configure under this runner's
            # newer CMake (it reads the removed LOCATION property), and its APR
            # deps need a >=3.5 policy floor that makes that read a hard error.
            # Drop the niche Apache modules on this platform, as on armv7.
            extra_cmake: -DWITH_APACHE=OFF

    env:
      CMAKE_BUILD_TYPE: RelWithDebInfo

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Allow legacy deps under newer CMake (ARM64)
        if: ${{ matrix.arch == 'arm64' }}
        run: echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV

      - name: CMake
        run: |
          cmake . -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} ${{ matrix.extra_cmake }}

      - name: Download dependencies
        run: cmake --build . --config $env:CMAKE_BUILD_TYPE --target download_deps || cmake --build . --config $env:CMAKE_BUILD_TYPE --target download_deps || cmake --build . --config $env:CMAKE_BUILD_TYPE --target download_deps

      - name: Build
        run: cmake --build . --config $env:CMAKE_BUILD_TYPE

      - name: Test
        run: ctest --verbose --build-config $env:CMAKE_BUILD_TYPE

      - name: Package binaries
        run: cmake --build . --config $env:CMAKE_BUILD_TYPE --target PACKAGE

      - name: Check version
        shell: bash
        run: |
          set -ex
          [ "`./bin/neko -version`" == "$NEKO_VERSION" ]

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows${{ matrix.name_suffix }}-binaries
          path: bin/neko-${{ env.NEKO_VERSION }}-win${{ matrix.name_suffix }}.zip

  mac-universal:
    name: mac universal
    needs: [mac-build]
    runs-on: macos-26

    env:
      INPUT_AMD64: mac-static-amd64-binaries
      INPUT_ARM64: mac-static-arm64-binaries

    steps:
      - name: Download ${{ env.INPUT_AMD64 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INPUT_AMD64 }}
          path: ${{ env.INPUT_AMD64 }}

      - name: Download ${{ env.INPUT_ARM64 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INPUT_ARM64 }}
          path: ${{ env.INPUT_ARM64 }}

      - name: Create universal binaries
        run: |
          tar_filename_amd64=$(basename $INPUT_AMD64/neko-*-osx64.tar.gz .tar.gz)
          OUTPUT=${tar_filename_amd64/osx64/osx-universal}

          mkdir $OUTPUT

          # put amd64 files straight into output to make sure all non-binary files are also included
          tar -xf $INPUT_AMD64/neko-*.tar.gz \
            -C $OUTPUT --strip-components=1
          tar -xf $INPUT_ARM64/neko-*.tar.gz \
            -C $INPUT_ARM64 --strip-components=1

          for filename in $OUTPUT/{*.ndll,libneko.*.*.*.dylib,neko,nekoc,nekoml,nekotools}; do
            filename_amd64=$filename
            filename_arm64=${filename/$OUTPUT/$INPUT_ARM64}
            lipo -create -output $filename $filename_amd64 $filename_arm64
          done

          file $OUTPUT/*
          tar -czvf $OUTPUT.tar.gz $OUTPUT

      - name: Upload universal binaries
        uses: actions/upload-artifact@v4
        with:
          name: mac-static-universal-binaries
          path: neko-*-osx-universal.tar.gz
